# Networking: Zephyr's native IPv4/TCP stack on top of the SiWx91x Wi-Fi driver
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
# A TCP connect to a host that is down fails after this; a closed port fails at once.
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=10000

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=6

CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_WRN=y

# SNTP timestamps; the DNS server comes from DHCP.
CONFIG_SNTP=y
CONFIG_DNS_RESOLVER=y

CONFIG_MQTT_LIB=y
CONFIG_MQTT_KEEPALIVE=60
CONFIG_MQTT_CLEAN_SESSION=y

# MQTT over TLS (CONFIG_GHANODE_MQTT_TLS): TLS 1.2 with the broker's RSA
# certificate. The broker's chain arrives in one record of up to 16 KB; the
# node only sends small ones.
CONFIG_MQTT_LIB_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65000
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
# The software handshake takes about 9 s on the board, against a 10 s default.
# The p256-m driver (CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED) failed the ECDHE
# step with -0x7f80 here.
CONFIG_NET_SOCKETS_TLS_CONNECT_TIMEOUT=30000
# Logs the Mbed TLS error code when a handshake fails.
CONFIG_NET_LOG=y
CONFIG_NET_SOCKETS_LOG_LEVEL_ERR=y

# Peripherals
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_ADC=y

# Kernel
CONFIG_EVENTS=y
CONFIG_REBOOT=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# Logging and float formatting (log messages and the JSON payload)
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PICOLIBC_IO_FLOAT=y
